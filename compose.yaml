name: tritontube

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.6.0
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=tritontube-etcd-cluster
    volumes:
      - etcd1-data:/etcd-data
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - endpoint
        - health
        - --endpoints=http://127.0.0.1:2379
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  etcd2:
    image: quay.io/coreos/etcd:v3.6.0
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=tritontube-etcd-cluster
    volumes:
      - etcd2-data:/etcd-data
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - endpoint
        - health
        - --endpoints=http://127.0.0.1:2379
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  etcd3:
    image: quay.io/coreos/etcd:v3.6.0
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=tritontube-etcd-cluster
    volumes:
      - etcd3-data:/etcd-data
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - endpoint
        - health
        - --endpoints=http://127.0.0.1:2379
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  storage1:
    build:
      context: .
      dockerfile: Dockerfile.storage
    image: tritontube-storage:local
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - /var/lib/tritontube
    volumes:
      - storage1-data:/var/lib/tritontube
    restart: unless-stopped

  storage2:
    build:
      context: .
      dockerfile: Dockerfile.storage
    image: tritontube-storage:local
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - /var/lib/tritontube
    volumes:
      - storage2-data:/var/lib/tritontube
    restart: unless-stopped

  storage3:
    build:
      context: .
      dockerfile: Dockerfile.storage
    image: tritontube-storage:local
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - /var/lib/tritontube
    volumes:
      - storage3-data:/var/lib/tritontube
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: tritontube-web:local
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - etcd
      - etcd1:2379,etcd2:2379,etcd3:2379
      - nw
      - 0.0.0.0:3343,storage1:8090,storage2:8090,storage3:8090
    ports:
      - "8080:8080"
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
      storage1:
        condition: service_started
      storage2:
        condition: service_started
      storage3:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: tritontube-admin:local
    profiles:
      - tools
    depends_on:
      web:
        condition: service_started

  test:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: builder
    command:
      - go
      - test
      - ./...
    profiles:
      - test

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  storage1-data:
  storage2-data:
  storage3-data:
